# Base de datos local para desarrollo. En Railway se usa el plugin de PostgreSQL.
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: mandaito
      POSTGRES_PASSWORD: mandaito
      POSTGRES_DB: mandaito
    ports:
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U mandaito']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
